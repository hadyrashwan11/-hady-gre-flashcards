<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hady GRE Vocabulary</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header><div><div class="title">GRE Vocabulary</div><div id="summary" class="meta"></div></div><div class="small" id="knownSummary"></div></header><div class="progressWrap"><div class="progress" id="progress"></div></div><div class="toolbar"><button data-mode="all" class="active">All</button><button data-mode="learned">Already learned</button><button data-mode="new">New words</button><button data-mode="learning" id="learningFilter">Still learning (0)</button><button data-mode="known" id="knownFilter">Known (0)</button><button data-mode="unseen" id="unseenFilter">Unseen (0)</button><button id="session25">Study 25</button></div><div class="searchRow"><input id="search" placeholder="Search for a word…" autocomplete="off" autocapitalize="none"></div><div class="scene" id="scene"><div class="card" id="card"><div class="face front"><div class="status" id="frontStatus"></div><div class="counter" id="counter"></div><div class="word" id="word"></div></div><div class="face back"><div class="status">Simple meaning</div><div class="definition" id="definition"></div></div></div></div><div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div><div class="rate"><button class="learn" id="markLearning">Still learning</button><button class="good" id="markKnown">I know this</button></div><div class="footer">Tap the card to flip · swipe left/right to move · progress and your place are saved on this device</div></div><script>window.GRE_WORDS=[];window.GRE_LEARNED_COUNT=93;</script><script src="data0.js"></script><script src="data1.js"></script><script src="data2.js"></script><script src="data3.js"></script><script src="data4.js"></script><script src="data5.js"></script><script src="data6.js"></
